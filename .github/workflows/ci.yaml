name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # Pinned to a commit, not the mutable v6 tag: a tag can be repointed at
        # new code by upstream at any time without any change here.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # GITHUB_TOKEN would otherwise remain readable from every later step
          # via .git/config; this job needs no push access, so there is no
          # reason to leave it there.
          persist-credentials: false

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        # Pinned to a commit, not the mutable v6 tag: same rationale as Checkout above.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Configure GitHub Packages authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm config set --location=user //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"

      - name: Install dependencies
        # --ignore-scripts: pnpm runs postinstall, and a fork PR can edit
        # package.json and the lockfile consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      # oxlint is provided by the Nix devShell (flake.nix), not a package.json
      # devDependency — see flake.nix's comment on why. Installing Nix just for
      # this one step is the org-wide trade-off: one pinned oxlint version
      # instead of 16 repos each independently drifting on their own
      # npm-resolved version.
      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Lint
        run: nix develop --command pnpm lint

      - name: Test
        run: pnpm test

      # Not part of `pnpm verify` (TEST_STANDARD.md §1): coverage aggregation
      # has reporting overhead that verify's fast-gate philosophy excludes.
      # The 4-metric 99% threshold is enforced inside vitest.config.ts, so this
      # step fails non-zero on a regression without any extra scripting.
      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        # Pinned to a commit, not the mutable v6 tag: same rationale as Checkout above.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  changeset:
    # PRs only: a changeset records a version bump for a change about to land
    # on main, so there is nothing to check on a push to main itself.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # `changeset status --since` needs the base branch's history, not
          # just the PR's own commits.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Configure GitHub Packages authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm config set --location=user //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Require a changeset for user-facing changes
        # Skips the requirement when the PR only touches docs/ — RELEASE_STANDARD.md
        # §1.2 excludes not-user-facing changes (docs-only, CI-config-only) from
        # needing a changeset.
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -qvE '^docs/'; then
            pnpm changeset status --since="$base"
          else
            echo "Only docs/ changed; no changeset required."
          fi
